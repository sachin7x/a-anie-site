<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Voice → Intent → Text visualization -->
  <defs>
    <filter id="drop-shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>

  <!-- Microphone -->
  <g transform="translate(50, 30)">
    <rect x="-8" y="-20" width="16" height="20" rx="2" fill="#131313"/>
    <circle cx="0" cy="-25" r="8" fill="#131313"/>
    <path d="M0 -25 q10 10 10 25" stroke="#B98BE8" strokeWidth="2" fill="none"/>
  </g>

  <!-- Arrow 1 -->
  <path d="M80 50 Q90 30 100 50" stroke="#B98BE8" strokeWidth="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Understanding -->
  <g transform="translate(120, 50)" filter="url(#drop-shadow)">
    <rect x="-20" y="-15" width="40" height="30" rx="4" fill="rgba(253,252,232,0.8)" stroke="#B98BE8" strokeWidth="1"/>
    <text x="0" y="5" text-anchor="middle" font-family="Instrument Serif, Newsreader, Georgia, serif" font-size="10" fill="#131313">UNDERSTANDS</text>
    <text x="0" y="18" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#131313">filler removed</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M160 50 Q170 30 180 50" stroke="#B98BE8" strokeWidth="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Writing -->
  <g transform="translate(200, 50)" filter="url(#drop-shadow)">
    <rect x="-20" y="-15" width="40" height="30" rx="4" fill="rgba(253,252,232,0.8)" stroke="#B98BE8" strokeWidth="1"/>
    <text x="0" y="5" text-anchor="middle" font-family="Instrument Serif, Newsreader, Georgia, serif" font-size="10" fill="#131313">WRITES</text>
    <text x="0" y="18" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#131313">"Monday works."</text>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="3" refY="2" orient="auto">
      <path d="M0 0 L0 4 L6 2 z" fill="#B98BE8"/>
    </marker>
  </defs>
</svg>