<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Microphone: capsule + stand + base -->
  <rect x="20" y="30" width="14" height="22" rx="7" />
  <line x1="27" y1="52" x2="27" y2="62" />
  <line x1="20" y1="62" x2="34" y2="62" />
  <line x1="20" y1="48" x2="34" y2="48" />

  <!-- Waveform: 5 vertical bars, one filled with accent-lav -->
  <line x1="46" y1="48" x2="46" y2="52" />
  <line x1="52" y1="42" x2="52" y2="58" />
  <line x1="58" y1="36" x2="58" y2="64" fill="var(--accent-lav)" stroke="none" />
  <line x1="64" y1="44" x2="64" y2="56" />
  <line x1="70" y1="48" x2="70" y2="52" />

  <!-- Cursor + text lines: arrow at left, then 3 short horizontal lines -->
  <path d="M82 50 L82 60 L85 57 L87 62 L89 61 L87 56 L91 56 Z" fill="var(--ink)" stroke="none" />
  <line x1="94" y1="50" x2="108" y2="50" />
  <line x1="94" y1="56" x2="104" y2="56" />
  <line x1="94" y1="62" x2="106" y2="62" />
</svg>
