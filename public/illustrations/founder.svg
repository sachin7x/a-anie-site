<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Solo developer story -->
  <defs>
    <filter id="drop-shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>

  <!-- Location -->
  <g transform="translate(50, 50)">
    <text x="0" y="-20" text-anchor="middle" font-family="Outfit, sans-serif" font-size="10" fill="#131313">
      Kishangarh
    </text>
    <text x="0" y="0" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#131313" opacity="0.7">
      Ajmer, Rajasthan, India
    </text>
  </g>

  <!-- Arrow down -->
  <path d="M100 80 Q100 100 100 120" stroke="#B98BE8" strokeWidth="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Desk -->
  <g transform="translate(100, 150)">
    <rect x="-40" y="-10" width="80" height="20" rx="3" fill="rgba(253,252,232,0.8)" stroke="#B98BE8" strokeWidth="1"/>
    <text x="0" y="5" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#131313">Desk</text>
  </g>

  <!-- Arrow down -->
  <path d="M100 170 Q100 190 100 210" stroke="#B98BE8" strokeWidth="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Microphone -->
  <g transform="translate(100, 220)" filter="url(#drop-shadow)">
    <rect x="-8" y="-20" width="16" height="20" rx="2" fill="#131313"/>
    <circle cx="0" cy="-25" r="8" fill="#131313"/>
    <text x="0" y="0" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#131313" opacity="0.7">Mic</text>
  </g>

  <!-- Arrow down -->
  <path d="M100 260 Q100 280 100 300" stroke="#B98BE8" strokeWidth="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Cursor -->
  <g transform="translate(100, 310)">
    <text x="0" y="0" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#131313" opacity="0.7">|</text>
    <text x="0" y="12" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#131313">Cursor</text>
  </g>

  <!-- Arrow down -->
  <path d="M100 340 Q100 360 100 380" stroke="#B98BE8" strokeWidth="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Product -->
  <g transform="translate(100, 390)" filter="url(#drop-shadow)">
    <rect x="-25" y="-25" width="50" height="50" rx="6" fill="rgba(253,252,232,0.9)" stroke="#B98BE8" strokeWidth="1"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#131313">A-Anie</text>
    <text x="0" y="10" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#131313">Product</text>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="3" refY="2" orient="auto">
      <path d="M0 0 L0 4 L6 2 z" fill="#B98BE8"/>
    </marker>
  </defs>
</svg>