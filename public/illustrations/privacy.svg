<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Envelope: rectangle + triangular flap (open), single fold line in accent-lav -->
  <rect x="20" y="36" width="80" height="52" rx="2" />
  <!-- Open flap: V from top corners down to a point -->
  <path d="M20 36 L60 64 L100 36" />
  <!-- Fold line at flap's crease (accent-lav) -->
  <line x1="20" y1="36" x2="60" y2="36" stroke="var(--accent-lav)" />
  <line x1="60" y1="36" x2="100" y2="36" stroke="var(--accent-lav)" />
</svg>
