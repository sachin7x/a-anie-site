<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Data handling transparency visualization -->
  <defs>
    <filter id="drop-shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="100" y="25" text-anchor="middle" font-family="Outfit, sans-serif" font-size="12" fill="#131313" font-weight="600">
    Privacy by Design
  </text>

  <!-- Data flow -->
  <g transform="translate(100, 60)">
    <!-- Input: User Voice -->
    <g transform="translate(-80, -20)">
      <rect x="-15" y="-15" width="30" height="30" rx="4" fill="rgba(253,252,232,0.8)" stroke="#B98BE8" strokeWidth="1"/>
      <text x="0" y="0" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#131313">🎤</text>
      <text x="0" y="20" text-anchor="middle" font-family="Outfit, sans-serif" font-size="8" fill="#131313">Voice Input</text>
    </g>

    <!-- Processing: On-device -->
    <g transform="translate(0, -20)">
      <rect x="-20" y="-20" width="40" height="40" rx="6" fill="rgba(253,252,232,0.9)" stroke="#10B981" strokeWidth="1.5"/>
      <text x="0" y="-5" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#10B981">On-device</text>
      <text x="0" y="8" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#10B981">Processing</text>
      <text x="0" y="21" text-anchor="middle" font-family="Outfit, sans-serif" font-size="8" fill="#10B981">No Cloud</text>
    </g>

    <!-- Output: Text -->
    <g transform="translate(80, -20)">
      <rect x="-15" y="-15" width="30" height="30" rx="4" fill="rgba(253,252,232,0.8)" stroke="#B98BE8" strokeWidth="1"/>
      <text x="0" y="0" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#131313">⌨️</text>
      <text x="0" y="20" text-anchor="middle" font-family="Outfit, sans-serif" font-size="8" fill="#131313">Text Output</text>
    </g>

    <!-- Transparency indicators -->
    <g transform="translate(-80, 20)">
      <circle cx="0" cy="0" r="12" fill="rgba(16,185,129,0.2)" stroke="#10B981" strokeWidth="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="Outfit, sans-serif" font-size="8" fill="#10B981">✓</text>
      <text x="0" y="18" text-anchor="middle" font-family="Outfit, sans-serif" font-size="7" fill="#10B981">Private</text>
    </g>

    <g transform="translate(80, 20)">
      <circle cx="0" cy="0" r="12" fill="rgba(239,68,68,0.2)" stroke="#EF4444" strokeWidth="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="Outfit, sans-serif" font-size="8" fill="#EF4444">✗</text>
      <text x="0" y="18" text-anchor="middle" font-family="Outfit, sans-serif" font-size="7" fill="#EF4444">No Tracking</text>
    </g>
  </g>

  <!-- Data expiry -->
  <g transform="translate(100, 140)">
    <rect x="-40" y="-10" width="80" height="20" rx="3" fill="rgba(253,252,232,0.5)" stroke="#6B7280" strokeWidth="1"/>
    <text x="0" y="2" text-anchor="middle" font-family="Outfit, sans-serif" font-size="8" fill="#6B7280">Data auto-deleted after processing</text>
  </g>

  <!-- Connectors -->
  <path d="M20 40 Q20 20 40 20" stroke="#B98BE8" strokeWidth="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M60 20 Q80 20 80 0" stroke="#B98BE8" strokeWidth="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M120 0 Q140 20 140 20" stroke="#B98BE8" strokeWidth="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M160 20 Q180 20 180 40" stroke="#B98BE8" strokeWidth="1" fill="none" marker-end="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="4" markerHeight="2" refX="2" refY="1" orient="auto">
      <path d="M0 0 L0 2 L4 1 z" fill="#B98BE8"/>
    </marker>
  </defs>
</svg>