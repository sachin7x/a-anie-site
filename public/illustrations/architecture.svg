<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Five circles in a row, connected by short lines, third filled with accent-lav -->
  <circle cx="20" cy="60" r="10" />
  <line x1="30" y1="60" x2="40" y2="60" />

  <circle cx="50" cy="60" r="10" />
  <line x1="60" y1="60" x2="70" y2="60" />

  <circle cx="80" cy="60" r="10" fill="var(--accent-lav)" stroke="none" />
  <circle cx="80" cy="60" r="10" />
  <line x1="90" y1="60" x2="100" y2="60" />

  <circle cx="110" cy="60" r="10" />

  <!-- Small label dots above each circle (mono-style tick marks) -->
  <line x1="20" y1="40" x2="20" y2="44" />
  <line x1="50" y1="40" x2="50" y2="44" />
  <line x1="80" y1="40" x2="80" y2="44" />
  <line x1="110" y1="40" x2="110" y2="44" />
</svg>
