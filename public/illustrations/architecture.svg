<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Technical stack visualization -->
  <defs>
    <filter id="drop-shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(253,252,232,0.05);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(253,252,232,0.15);stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bg-gradient)"/>

  <!-- Title -->
  <text x="100" y="25" text-anchor="middle" font-family="Outfit, sans-serif" font-size="12" fill="#131313" font-weight="600">
    Technical Stack
  </text>

  <!-- Layers -->
  <g transform="translate(100, 50)">
    <!-- Layer 4: Application -->
    <rect x="-80" y="-40" width="160" height="30" rx="4" fill="rgba(253,252,232,0.8)" stroke="#1D4ED8" strokeWidth="1.5"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Outfit, sans-serif" font-size="10" fill="#1D4ED8">A-Anie Application</text>

    <!-- Layer 3: Framework -->
    <rect x="-70" y="-10" width="140" height="20" rx="3" fill="rgba(253,252,232,0.7)" stroke="#10B981" strokeWidth="1"/>
    <text x="0" y="2" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#10B981">Next.js 14 + React 19</text>

    <!-- Layer 2: Styling & Assets -->
    <rect x="-60" y="20" width="120" height="20" rx="3" fill="rgba(253,252,232,0.6)" stroke="#F59E0B" strokeWidth="1"/>
    <text x="0" y="34" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#F59E0B">Tailwind CSS + Custom SVGs</text>

    <!-- Layer 1: Language & Tooling -->
    <rect x="-50" y="50" width="100" height="20" rx="3" fill="rgba(253,252,232,0.5)" stroke="#8B5CF6" strokeWidth="1"/>
    <text x="0" y="64" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#8B5CF6">TypeScript + Turbopack</text>

    <!-- Connectors -->
    <path d="M0 -25 Q0 -20 0 -15" stroke="#6B7280" strokeWidth="1" fill="none" stroke-dasharray="2,2"/>
    <path d="M0 5 Q0 10 0 15" stroke="#6B7280" strokeWidth="1" fill="none" stroke-dasharray="2,2"/>
    <path d="M0 35 Q0 40 0 45" stroke="#6B7280" strokeWidth="1" fill="none" stroke-dasharray="2,2"/>
  </g>

  <!-- Badge: Solo Built -->
  <g transform="translate(100, 140)">
    <rect x="-40" y="-12" width="80" height="24" rx="12" fill="rgba(139,92,246,0.1)" stroke="#8B5CF6" strokeWidth="1"/>
    <text x="0" y="4" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#8B5CF6">Built by one developer</text>
  </g>
</svg>