<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- System-level text injection -->
  <defs>
    <filter id="drop-shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>

  <!-- Text field -->
  <g transform="translate(50, 50)">
    <rect x="-60" y="-20" width="120" height="40" rx="4" fill="rgba(253,252,232,0.8)" stroke="#B98BE8" strokeWidth="1"/>
    <text x="0" y="0" text-anchor="middle" font-family="Outfit, sans-serif" font-size="12" fill="#131313">
      Hello world, this is a test
    </text>
    <text x="0" y="18" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#131313" opacity="0.7">
      | ← cursor position
    </text>
  </g>

  <!-- Injection arrow -->
  <path d="M110 70 Q130 50 150 70" stroke="#B98BE8" strokeWidth="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- A-Anie processing -->
  <g transform="translate(180, 70)" filter="url(#drop-shadow)">
    <rect x="-25" y="-25" width="50" height="50" rx="6" fill="rgba(253,252,232,0.9)" stroke="#B98BE8" strokeWidth="1"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Outfit, sans-serif" font-size="10" fill="#131313">A-Anie</text>
    <text x="0" y="4" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#131313">Processing</text>
    <text x="0" y="16" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#131313">"Hello world, this is a test"</text>
  </g>

  <!-- Result -->
  <g transform="translate(250, 70)" filter="url(#drop-shadow)">
    <rect x="-60" y="-20" width="120" height="40" rx="4" fill="rgba(253,252,232,0.8)" stroke="#B98BE8" strokeWidth="1"/>
    <text x="0" y="0" text-anchor="middle" font-family="Outfit, sans-serif" font-size="12" fill="#131313">
      Hello world, this is a test.
    </text>
    <text x="0" y="18" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" fill="#131313" opacity="0.7">
      | ← updated cursor
    </text>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="3" refY="2" orient="auto">
      <path d="M0 0 L0 4 L6 2 z" fill="#B98BE8"/>
    </marker>
  </defs>
</svg>