<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Open Graph Image for A-Anie -->
  <defs>
    <filter id="drop-shadow">
      <feDropShadow dx="4" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8F4E0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B98BE8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Main Title -->
  <text x="600" y="120" text-anchor="middle" font-family="Outfit, sans-serif" font-size="48" fill="#131313" font-weight="700">
    A-Anie
  </text>
  <text x="600" y="170" text-anchor="middle" font-family="Outfit, sans-serif" font-size="24" fill="#6B7280">
    Speak. Think. Write.
  </text>

  <!-- Left side: Voice input visualization -->
  <g transform="translate(250, 300)">
    <!-- Microphone -->
    <g filter="url(#drop-shadow)">
      <rect x="-12" y="-20" width="24" height="28" rx="4" fill="#131313"/>
      <circle cx="0" cy="-28" r="12" fill="#131313"/>
    </g>

    <!-- Sound waves -->
    <path d="M0 -20 Q15 -10 0 0 Q-15 10 0 20" stroke="#B98BE8" strokeWidth="2" fill="none" opacity="0.7"/>
    <path d="M0 -30 Q25 -15 0 0 Q-25 15 0 30" stroke="#B98BE8" strokeWidth="2" fill="none" opacity="0.5"/>
    <path d="M0 -40 Q35 -20 0 0 Q-35 20 0 40" stroke="#B98BE8" strokeWidth="2" fill="none" opacity="0.3"/>
  </g>

  <!-- Right side: Text output visualization -->
  <g transform="translate(950, 300)">
    <!-- Text field -->
    <g filter="url(#drop-shadow)">
      <rect x="-80" y="-20" width="160" height="40" rx="8" fill="rgba(253,252,232,0.9)" stroke="#B98BE8" strokeWidth="1"/>
      <text x="0" y="0" text-anchor="middle" font-family="Outfit, sans-serif" font-size="16" fill="#131313">
        "That works on my end."
      </text>
      <text x="0" y="22" text-anchor="middle" font-family="Outfit, sans-serif" font-size="10" fill="#6B7280" opacity="0.8">
        | ← cursor
      </text>
    </g>
  </g>

  <!-- Central A-Anie processing -->
  <g transform="translate(600, 300)" filter="url(#drop-shadow)">
    <rect x="-30" y="-30" width="60" height="60" rx="12" fill="rgba(253,252,232,0.95)" stroke="#B98BE8" strokeWidth="1.5"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Outfit, sans-serif" font-size="14" fill="#131313" font-weight="600">
      A-Anie
    </text>
    <text x="0" y="12" text-anchor="middle" font-family="Outfit, sans-serif" font-size="12" fill="#6B7280">
      AI Processing
    </text>
  </g>

  <!-- Processing arrows -->
  <path d="M200 300 Q250 250 300 300" stroke="#B98BE8" strokeWidth="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M900 300 Q850 250 800 300" stroke="#B98BE8" strokeWidth="2" fill="none" marker-end="url(#arrowhead-reverse)"/>

  <!-- Badges -->
  <g transform="translate(600, 520)">
    <rect x="-100" y="-12" width="200" height="24" rx="12" fill="rgba(185,139,232,0.1)" stroke="#B98BE8" strokeWidth="1"/>
    <text x="0" y="4" text-anchor="middle" font-family="Outfit, sans-serif" font-size="12" fill="#B98BE8">
      Built by one developer in Kishangarh, India
    </text>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0 0 L0 6 L8 3 z" fill="#B98BE8"/>
    </marker>
    <marker id="arrowhead-reverse" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M8 0 L8 6 L0 3 z" fill="#B98BE8"/>
    </marker>
  </defs>
</svg>